<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >  <title>BONGKAR CONFIG HC</title>  <link
    rel="stylesheet"
    href="/style.css"
  >
</head><body>  <main class="container"><!-- HEADER -->

<header class="header">

  <div class="logo">
    🔐
  </div>

  <h1>
    BONGKAR CONFIG HC
  </h1>

  <p>
    HTTP Custom Config Decryptor
  </p>

</header>


<!-- UPLOAD -->

<section class="upload-card">

  <div
    class="upload-box"
    id="uploadBox"
  >

    <div class="upload-icon">
      📁
    </div>

    <h2>
      Pilih File HC
    </h2>

    <p>
      Klik untuk memilih file atau
      drag &amp; drop di sini
    </p>

    <span class="format">
      .HC ONLY
    </span>

    <input
      type="file"
      id="fileInput"
      accept=".hc"
    >

    <div
      id="fileName"
      class="file-name"
    ></div>

  </div>


  <button
    id="decryptBtn"
    class="decrypt-btn"
    disabled
  >
    <span>🔓</span>
    BONGKAR CONFIG
  </button>

</section>


<!-- STATUS -->

<div
  id="status"
  class="status"
></div>


<!-- RESULT -->

<section
  id="result"
  class="result"
></section>


<!-- FOOTER -->

<footer>
  BONGKAR CONFIG HC
  <span>•</span>
  HTTP CUSTOM
</footer>

  </main>  <script src="/app.js"></script></body>
</html>
