<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BONGKAR CONFIG EHI</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<main class="container">

  <header class="header">

    <div class="logo">🔐</div>

    <h1>BONGKAR CONFIG EHI</h1>

    <p>HTTP Injector Config</p>

  </header>


  <section class="upload-card">

    <label
      class="upload-box"
      id="uploadBox"
      for="fileInput"
    >

      <div class="upload-icon">
        📁
      </div>

      <h2>Pilih File EHI</h2>

      <p>
        Klik di sini untuk memilih file
      </p>

      <span class="format">
        .EHI ONLY
      </span>

      <input
        type="file"
        id="fileInput"
        accept=".ehi,.EHI"
      >

    </label>


    <div
      id="fileName"
      class="file-name"
    ></div>


    <button
      type="button"
      id="decryptBtn"
      class="decrypt-btn"
      disabled
    >
      🔓 BONGKAR CONFIG
    </button>

  </section>


  <div
    id="status"
    class="status"
  ></div>


  <section
    id="result"
    class="result"
  ></section>


  <footer>
    BONGKAR CONFIG EHI
    <span>•</span>
    HTTP INJECTOR
  </footer>

</main>


<script src="/app.js"></script>

</body>
</html>
