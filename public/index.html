<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="BONGKAR CONFIG HC + EHI - HTTP Custom dan HTTP Injector Config Decryptor"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>BONGKAR CONFIG HC + EHI</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <main class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

      <div class="logo">
        🔐
      </div>

      <h1>
        BONGKAR CONFIG
      </h1>

      <p>
        HC + EHI CONFIG DECRYPTOR
      </p>

    </header>


    <!-- =========================
         UPLOAD CARD
    ========================== -->

    <section class="upload-card">

      <label
        class="upload-box"
        id="uploadBox"
        for="fileInput"
      >

        <div class="upload-icon">
          📁
        </div>

        <h2>
          Pilih File HC / EHI
        </h2>

        <p>
          Klik di sini atau drag & drop file
        </p>

        <span class="format">
          .HC + .EHI
        </span>

        <input
          type="file"
          id="fileInput"
          accept=".hc,.ehi"
        >

        <div
          id="fileName"
          class="file-name"
        ></div>

      </label>


      <!-- =========================
           DECRYPT BUTTON
      ========================== -->

      <button
        type="button"
        id="decryptBtn"
        class="decrypt-btn"
        disabled
      >
        🔓 BONGKAR CONFIG
      </button>

    </section>


    <!-- =========================
         STATUS
    ========================== -->

    <div
      id="status"
      class="status"
    ></div>


    <!-- =========================
         RESULT
    ========================== -->

    <section
      id="result"
      class="result"
    ></section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

      <span>
        BONGKAR CONFIG
      </span>

      <b>•</b>

      <span>
        HC + EHI
      </span>

    </footer>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="/app.js"></script>

</body>
</html>
