<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>HTTP Custom Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 flex items-center justify-center">
  <div class="max-w-md w-full space-y-6">
    <h1 class="text-2xl font-bold text-center text-emerald-400">HTTP Custom Generator</h1>

    <div class="bg-slate-800 p-5 rounded-xl shadow space-y-4">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Pilih Operator:</label>
        <select id="operatorSelect" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-100">
          <option value="">Memuat operator...</option>
        </select>
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Kredensial SSH (host:port@username:password):</label>
        <input type="text" id="credential" placeholder="id-biznett.suneku.web.id:443@sunek:ssh7k" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-100"/>
      </div>

      <button onclick="generateConfig()" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-medium transition">Generate & Download .hc</button>
    </div>

    <div class="bg-slate-800 p-5 rounded-xl shadow space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-semibold text-yellow-300 text-xs uppercase tracking-wider">Hasil Output / Raw Config</h2>
        <button onclick="copyOutput()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1 rounded text-slate-200 transition">Salin Teks</button>
      </div>
      <textarea id="output" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-xs font-mono text-emerald-300 resize-none" readonly>Menunggu generate...</textarea>
    </div>
  </div>

  <script>
    window.onload = async () => {
      try {
        const res = await fetch('/api/operators');
        const data = await res.json();
        const select = document.getElementById('operatorSelect');
        if (data.success && data.operators.length > 0) {
          select.innerHTML = data.operators.map(op => `<option value="${op}">${op.toUpperCase()}</option>`).join('');
        } else {
          select.innerHTML = '<option value="">Tidak ada file bug ditemukan</option>';
        }
      } catch (e) {
        console.error("Gagal memuat operator");
      }
    };

    async function generateConfig() {
      const operator = document.getElementById('operatorSelect').value;
      const credential = document.getElementById('credential').value;
      if (!operator || !credential) return alert('Pilih operator dan masukkan kredensial!');
      
      document.getElementById('output').value = "Memproses konfigurasi...";
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ operator, credential })
      });
      const data = await res.json();
      
      if (data.success) {
        document.getElementById('output').value = data.rawConfig;
        
        // Otomatis download file .hc
        const blob = new Blob([data.rawConfig], { type: 'application/octet-stream' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `config_${operator}_${Date.now()}.hc`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      } else {
        document.getElementById('output').value = "Error: " + data.error;
      }
    }

    function copyOutput() {
      const outputText = document.getElementById('output');
      if (!outputText.value || outputText.value.startsWith("Menunggu") || outputText.value.startsWith("Memproses") || outputText.value.startsWith("Error")) {
        return alert("Belum ada hasil config yang bisa disalin!");
      }
      navigator.clipboard.writeText(outputText.value).then(() => {
        alert("Berhasil menyalin raw config ke clipboard!");
      }).catch(err => {
        alert("Gagal menyalin teks.");
      });
    }
  </script>
</body>
</html>
