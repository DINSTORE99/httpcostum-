<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DINSTORE Decryptor</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">DINSTORE</div>
    <h1>Config Decryptor</h1>
    <p>Buka dan decrypt file HTTP Custom</p>
  </div>

  <!-- UPLOAD -->

  <div class="card">

    <div id="dropArea" class="drop-area">

      <div class="icon">📁</div>

      <h3>Upload File</h3>

      <p>
        Pilih file <b>.HC</b>
      </p>

      <input
        type="file"
        id="fileInput"
        accept=".hc"
        hidden
      >

      <button id="chooseBtn">
        Pilih File
      </button>

    </div>

    <!-- FILE -->

    <div
      id="fileBox"
      class="file-box"
      style="display:none"
    >

      <div>
        <div id="fileName"></div>
        <small id="fileSize"></small>
      </div>

      <button id="removeBtn">
        ✕
      </button>

    </div>

    <!-- DECRYPT -->

    <button
      id="decryptBtn"
      class="decrypt-btn"
      disabled
    >
      🔓 Buka File
    </button>

    <div id="status"></div>

  </div>


  <!-- RESULT -->

  <div
    id="resultCard"
    class="card result-card"
    style="display:none"
  >

    <div class="result-title">

      <div>
        <h2>✅ Hasil Decrypt</h2>

        <small id="resultFormat"></small>
      </div>

      <button id="copyBtn">
        📋 Salin
      </button>

    </div>


    <!-- CONFIG -->

    <div id="configResult"></div>


    <!-- PROTECTION -->

    <div id="protectionSection">

      <h3>🛡️ Protections</h3>

      <pre id="protections"></pre>

    </div>


    <!-- RAW -->

    <div>

      <h3>📄 Raw Config</h3>

      <pre id="raw"></pre>

    </div>

  </div>

</div>

<script src="/app.js"></script>

</body>
</html>
