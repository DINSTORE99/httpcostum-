<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DINSTORE Decryptor</title>

  <link rel="stylesheet" href="/style.css">

</head>

<body>

  <main class="container">

    <section class="card">

      <div class="logo">
        DINSTORE
      </div>

      <h1>Decryptor</h1>

      <p class="subtitle">
        Buka dan baca file konfigurasi
      </p>

      <!-- UPLOAD -->

      <div
        class="upload-box"
        id="dropArea"
      >

        <div class="upload-icon">
          📁
        </div>

        <h3>
          Pilih File
        </h3>

        <p>
          .HC • .DARK • .EHI • .NPV • .SCC
        </p>

        <input
          type="file"
          id="fileInput"
          hidden
        >

        <button
          class="btn"
          id="chooseBtn"
        >
          Pilih File
        </button>

      </div>

      <!-- FILE PREVIEW -->

      <div
        class="file-preview"
        id="filePreview"
        style="display:none"
      >

        <div class="file-info">

          <span class="file-icon">
            📄
          </span>

          <div>

            <strong id="fileName">
              -
            </strong>

            <small id="fileSize">
              -
            </small>

          </div>

        </div>

        <button
          class="remove-btn"
          id="removeBtn"
        >
          ✕
        </button>

      </div>

      <!-- OPEN BUTTON -->

      <button
        class="open-btn"
        id="openBtn"
        disabled
      >
        🔓 Buka File
      </button>

      <!-- STATUS -->

      <div
        class="message"
        id="message"
      ></div>

    </section>

    <!-- RESULT -->

    <section
      class="result-card"
      id="resultCard"
      style="display:none"
    >

      <div class="result-header">

        <div>

          <h2>
            📄 Hasil File
          </h2>

          <span id="resultName">
            -
          </span>

        </div>

        <button
          class="copy-btn"
          id="copyBtn"
        >
          📋 Salin
        </button>

      </div>

      <pre
        id="result"
      ></pre>

      <button
        class="download-btn"
        id="downloadBtn"
      >
        💾 Download Hasil
      </button>

    </section>

  </main>

  <script src="/app.js"></script>

</body>

</html>
