<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DINSTORE Decryptor</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="container">

    <h1>DINSTORE DECRYPTOR</h1>
    <p class="subtitle">Decrypt file HC & EHI</p>

    <div id="dropZone" class="drop-zone">

      <input
        type="file"
        id="fileInput"
        accept=".hc,.ehi"
        hidden
      >

      <div class="upload-icon">📁</div>

      <h2>Pilih File</h2>

      <p id="fileText">
        Klik tombol di bawah untuk memilih file
      </p>

      <button
        type="button"
        id="selectBtn"
        class="btn"
      >
        Pilih File
      </button>

    </div>

    <button
      type="button"
      id="decryptBtn"
      class="btn decrypt-btn"
      disabled
    >
      🔓 Decrypt
    </button>

    <div id="status" class="status"></div>

    <div id="resultBox" class="result-box" hidden>

      <div class="result-header">
        <span>Hasil Decrypt</span>

        <button
          type="button"
          id="copyBtn"
          class="copy-btn"
        >
          Copy
        </button>
      </div>

      <pre id="result"></pre>

    </div>

  </div>

  <script src="/app.js"></script>

</body>
</html>
