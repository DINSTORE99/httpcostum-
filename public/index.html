<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DINSTORE Decryptor</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>

<body>

  <main class="container">

    <div class="logo">
      D
    </div>

    <h1>
      DINSTORE
      <span>Decryptor</span>
    </h1>

    <p class="description">
      Upload file konfigurasi untuk diproses.
    </p>


    <section
      class="upload"
      id="upload"
    >

      <input
        type="file"
        id="fileInput"
        hidden
      >

      <div class="upload-icon">
        ↑
      </div>

      <h2>
        Upload File
      </h2>

      <p>
        Klik atau tarik file ke area ini
      </p>

      <button
        id="selectFile"
        type="button"
      >
        Pilih File
      </button>

    </section>


    <div
      class="file"
      id="fileInfo"
      hidden
    >

      <div class="file-icon">
        FILE
      </div>

      <div class="file-data">

        <strong id="fileName">
          -
        </strong>

        <small id="fileSize">
          -
        </small>

      </div>

      <button
        id="removeFile"
        type="button"
      >
        ×
      </button>

    </div>


    <button
      id="uploadBtn"
      class="upload-btn"
      disabled
    >
      Upload File
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </main>


  <script src="/app.js"></script>

</body>

</html>
