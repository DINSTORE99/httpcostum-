<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>EHI API</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 90%;
      max-width: 500px;
      padding: 30px;

      background: #101010;
      border: 1px solid #292929;
      border-radius: 18px;

      text-align: center;
    }

    .logo {
      font-size: 50px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
    }

    p {
      color: #999;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 15px;

      background: #102d1b;
      color: #42e87b;

      border-radius: 20px;
      font-size: 14px;
    }

    code {
      display: block;
      margin-top: 20px;
      padding: 15px;

      background: #050505;
      border-radius: 10px;

      color: #aaa;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">🔐</div>

    <h1>EHI API</h1>

    <p>
      HTTP Injector configuration
      processing API.
    </p>

    <div class="status">
      ● API ONLINE
    </div>

    <code>
      POST /api/ehi
    </code>

  </div>

</body>
</html>
